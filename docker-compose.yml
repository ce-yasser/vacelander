services:
  postgres:
    image: postgres:17-alpine
    container_name: vaclendar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vaclendar
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vaclendar-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vaclendar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vaclendar-pgdata:
